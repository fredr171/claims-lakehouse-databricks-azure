# MA payer medical claims (UB-04 and CMS-1500 in one file): one row
# per claim line per claim version. A reversal reuses CLAIM_ID with CLAIM_FREQ_CD 8.
# expected_columns: the header of MAP_MEDCLM_YYYYMM.csv from synthetic-payer-files v2.0.0,
# in order (tests/test_config.py checks them against a generated delivery).
feed: ma_payer
file_type: medical_claim_lines

# Named groups year and month are required: they give the delivery month.
file_name_regex: '^MAP_MEDCLM_(?P<year>\d{4})(?P<month>0[1-9]|1[0-2])\.csv$'

# Must be non-empty on every row (the payer's keys for the record).
key_columns:
  - CLAIM_ID
  - CLAIM_LINE_NUM
  - CLAIM_FREQ_CD
  - MEMBER_ID

expected_columns:
  - CLAIM_ID
  - CLAIM_LINE_NUM
  - ORIG_CLAIM_ID
  - CLAIM_STATUS
  - CLAIM_FREQ_CD
  - CLAIM_FORM_TYPE
  - BILL_TYPE
  - MEMBER_ID
  - MBI
  - CONTRACT_ID
  - PBP_ID
  - SERVICE_FROM_DT
  - SERVICE_TO_DT
  - ADMIT_DT
  - DISCHARGE_DT
  - ADMIT_TYPE
  - ADMIT_SOURCE
  - DISCHARGE_STATUS
  - DRG_CD
  - LINE_FROM_DT
  - LINE_TO_DT
  - REVENUE_CD
  - PROCEDURE_CD
  - MODIFIER_1
  - UNITS
  - PLACE_OF_SERVICE
  - BILLING_NPI
  - BILLING_TIN
  - RENDERING_NPI
  - ATTENDING_NPI
  - FACILITY_CCN
  - PROVIDER_SPECIALTY
  - IN_NETWORK_FLAG
  - CAPITATED_FLAG
  - BILLED_AMT
  - ALLOWED_AMT
  - PAID_AMT
  - COPAY_AMT
  - COINSURANCE_AMT
  - DEDUCTIBLE_AMT
  - ICD_VERSION
  - DX_CODE_1
  - DX_CODE_2
  - DX_CODE_3
  - DX_CODE_4
  - DX_CODE_5
  - DX_CODE_6
  - DX_CODE_7
  - DX_CODE_8
  - DX_CODE_9
  - DX_CODE_10
  - DX_CODE_11
  - DX_CODE_12
  - RECEIVED_DT
  - PROCESSED_DT
  - PAID_DT
