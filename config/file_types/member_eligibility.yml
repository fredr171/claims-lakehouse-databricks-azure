# MA payer member eligibility: one row per member per delivery
# in which the member is new, changed or terminated (full row, current values).
# expected_columns: the header of MAP_ELIG_YYYYMM.csv from synthetic-payer-files v2.0.0,
# in order (tests/test_config.py checks them against a generated delivery).
feed: ma_payer
file_type: member_eligibility

# Named groups year and month are required: they give the delivery month.
file_name_regex: '^MAP_ELIG_(?P<year>\d{4})(?P<month>0[1-9]|1[0-2])\.csv$'

# Must be non-empty on every row (the payer's keys for the record).
key_columns:
  - MEMBER_ID

expected_columns:
  - MEMBER_ID
  - MBI
  - FIRST_NAME
  - MIDDLE_INITIAL
  - LAST_NAME
  - DOB
  - GENDER
  - ADDRESS_LINE_1
  - CITY
  - STATE
  - ZIP
  - COUNTY_FIPS
  - CONTRACT_ID
  - PBP_ID
  - PLAN_NAME
  - PRODUCT_TYPE
  - ENROLLMENT_START_DT
  - ENROLLMENT_END_DT
  - PCP_NPI
  - PCP_TIN
  - PCP_ATTRIBUTION_START_DT
  - DUAL_FLAG
  - LIS_FLAG
  - ESRD_FLAG
  - HOSPICE_FLAG
  - DEATH_DT
  - FILE_AS_OF_DT
  - RECORD_CHANGE_TYPE
