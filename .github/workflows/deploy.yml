# Deploy the code to a running environment: both Functions and the Databricks bundle.
# Started by hand, after a reviewed local `terraform apply` has created the environment.
#
# Signs in to Azure with OIDC (workload identity federation): GitHub issues a short-lived
# token for this run, and the federated credential in infra/terraform/github_oidc.tf lets
# it act as the deploy identity. No Azure credential is stored in GitHub.
#
# Every value comes from the `dev` environment's variables (Settings -> Environments), set
# from `terraform output`; none of them are secrets, and none are committed.
name: deploy

on:
  workflow_dispatch:

permissions:
  id-token: write  # request the OIDC token
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the Functions
        shell: pwsh
        env:
          VALIDATION_FUNCTION: ${{ vars.VALIDATION_FUNCTION }}
          NOTIFIER_FUNCTION: ${{ vars.NOTIFIER_FUNCTION }}
        run: |
          $apps = @{ validation = $env:VALIDATION_FUNCTION; notifier = $env:NOTIFIER_FUNCTION }
          foreach ($app in $apps.Keys) {
              ./functions/build.ps1 -App $app
              az functionapp deployment source config-zip -g $env:RESOURCE_GROUP -n $apps[$app] `
                  --src "build/$app.zip" --build-remote true -o none
              if ($LASTEXITCODE -ne 0) { throw "deploying $app failed" }
          }

      - uses: databricks/setup-cli@main

      - name: Deploy the Databricks bundle
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: azure-cli
          BUNDLE_VAR_archive_url: ${{ vars.ARCHIVE_URL }}
          BUNDLE_VAR_runner_application_id: ${{ vars.RUNNER_APPLICATION_ID }}
        run: |
          databricks bundle validate
          databricks bundle deploy
