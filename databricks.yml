# Databricks Asset Bundle: the code-level resources (pipelines and the job).
# Terraform owns the workspace, Unity Catalog objects and storage (infra/terraform).
#
# The workspace comes from DATABRICKS_HOST and the archive URL from BUNDLE_VAR_archive_url
# (see .env.example); neither is committed.
#   databricks bundle validate
#   databricks bundle deploy      # creates billable resources: ask first

bundle:
  name: claims-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog (terraform output catalog)
    default: claims_lakehouse_dev
  archive_url:
    description: abfss URL of the archive container, ending in / (terraform output archive_url)
  runner_application_id:
    description: Service principal the pipelines and the job run as (terraform output runner_application_id)
  pii_readers_group:
    description: Sees unmasked names, addresses and birth dates (terraform output pii_readers_group)
    default: claims-lakehouse-pii-readers-dev

# The runner is in the PII readers group, so pipelines compute from unmasked values while
# people querying the tables see masked ones. It also needs to read the synced code.
run_as:
  service_principal_name: ${var.runner_application_id}

permissions:
  - service_principal_name: ${var.runner_application_id}
    level: CAN_MANAGE
  - user_name: ${workspace.current_user.userName}  # whoever deploys
    level: CAN_MANAGE

sync:
  # Only the code the pipelines and tasks import, and the validation config they read.
  include:
    - src/**
    - config/**
  exclude:
    - "**/__pycache__/**"
    - .venv/**
    - tests/**
    - infra/**
    - functions/**
    - build/**

targets:
  dev:
    default: true
    # Not development mode: it would pause the file-arrival trigger.
    workspace:
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
